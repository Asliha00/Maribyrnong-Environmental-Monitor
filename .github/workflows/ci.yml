# Runs every test, linter and the frontend build on every push and pull request.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: Lint (ruff, incl. S608 SQL-string rule)
        run: python -m ruff check backend scripts
      - name: Tests with coverage (backend + pipeline, SQLite)
        run: python -m pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      - name: No secrets or database hosts in the built frontend (SEC-16)
        run: |
          # Real secret VALUES: Blob read-write tokens, database hosts and connection strings.
          # (The Blob client SDK mentions the variable name BLOB_READ_WRITE_TOKEN in an error
          # message; a name is not a secret, so names are not matched. DECISIONS.md D-033.)
          if grep -rEl "neon\.tech|vercel_blob_rw_[A-Za-z0-9]{8,}|postgres(ql)?://" dist; then
            echo "Secret-looking strings found in frontend/dist"; exit 1
          fi

  upload:
    # The Node service that issues private Blob upload tokens (BUILD_PROMPT §4.5, SEC-15/20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: upload
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upload/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    # Browser tests (Playwright) against the PRODUCTION build served with the vercel.json
    # headers (CSP), on a SYNTHETIC fixture database: no council data or real secrets needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python -m pip install -e ".[dev]"
      - run: npm ci --prefix frontend
      - run: npm ci --prefix e2e
      - run: npx --prefix e2e playwright install --with-deps chromium
      - name: Throwaway secrets and demo passwords for this run only (masked)
        run: |
          python - <<'PY'
          import os, secrets
          from cryptography.fernet import Fernet
          values = {
              "JWT_SECRET": secrets.token_urlsafe(48),
              "MFA_ENCRYPTION_KEY": Fernet.generate_key().decode(),
              "SEED_ANALYST_PASSWORD": secrets.token_urlsafe(18),
              "SEED_ADMIN_PASSWORD": secrets.token_urlsafe(18),
          }
          for value in values.values():
              print(f"::add-mask::{value}", flush=True)      # to the log: hides each value
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  env.write(f"{key}={value}\n")             # to later steps only
          PY
      - name: Playwright
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ github.run_id }}
          path: e2e/test-results/
          retention-days: 14
